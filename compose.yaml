name: spending-tracker

services:
  tailscale:
    image: tailscale/tailscale:latest
    container_name: ${COMPOSE_PROJECT_NAME:-spending-tracker}-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-spending-tracker-api}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
    volumes:
      - ./docker-data/tailscale:/var/lib/tailscale
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-spending-tracker}-api
    network_mode: service:tailscale
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_PATH: /app/data/spending-tracker.sqlite
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set to a strong deployment-specific value}
      EMPTY_ACCOUNT_GRACE_HOURS: ${EMPTY_ACCOUNT_GRACE_HOURS:-12}
      INACTIVE_ACCOUNT_RETENTION_MONTHS: ${INACTIVE_ACCOUNT_RETENTION_MONTHS:-12}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-12}
      MAX_DEVICE_ACCOUNTS: ${MAX_DEVICE_ACCOUNTS:-1000}
      DEVICE_REGISTRATIONS_PER_WINDOW: ${DEVICE_REGISTRATIONS_PER_WINDOW:-10}
      DIAGNOSTIC_MAX_PER_USER: ${DIAGNOSTIC_MAX_PER_USER:-20}
      DIAGNOSTIC_MAX_TOTAL: ${DIAGNOSTIC_MAX_TOTAL:-1000}
      DIAGNOSTIC_RETENTION_DAYS: ${DIAGNOSTIC_RETENTION_DAYS:-30}
      WEBSOCKET_MAX_PER_USER: ${WEBSOCKET_MAX_PER_USER:-5}
      WEBSOCKET_MAX_TOTAL: ${WEBSOCKET_MAX_TOTAL:-200}
    volumes:
      - ./docker-data/database:/app/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      tailscale:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
