name: spending-tracker

services:
  tailscale:
    image: tailscale/tailscale:stable
    container_name: ${COMPOSE_PROJECT_NAME:-spending-tracker}-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-spending-tracker-api}
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTH_ONCE: "true"
      TS_USERSPACE: "false"
      TS_ACCEPT_DNS: "false"
      TS_SERVE_CONFIG: /config/funnel.json
      TS_ENABLE_HEALTH_CHECK: "true"
      TS_LOCAL_ADDR_PORT: 127.0.0.1:9002
    volumes:
      - ./docker-data/tailscale:/var/lib/tailscale
      - ./config/tailscale:/config:ro
    devices:
      - /dev/net/tun:/dev/net/tun
    cap_add:
      - NET_ADMIN
      - NET_RAW
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9002/healthz >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-spending-tracker}-api
    network_mode: service:tailscale
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "4000"
      DB_PATH: /app/data/spending-tracker.sqlite
      EMPTY_ACCOUNT_GRACE_HOURS: ${EMPTY_ACCOUNT_GRACE_HOURS:-12}
      INACTIVE_ACCOUNT_RETENTION_MONTHS: ${INACTIVE_ACCOUNT_RETENTION_MONTHS:-12}
      CLEANUP_INTERVAL_HOURS: ${CLEANUP_INTERVAL_HOURS:-12}
    volumes:
      - ./docker-data/database:/app/data
    depends_on:
      tailscale:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4000/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
