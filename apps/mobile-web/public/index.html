    <link rel="apple-touch-icon" href="./icon-192.png" />
    <title>Spending Tracker — Private, offline-ready expense tracking</title>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Spending Tracker",
        "url": "https://justinecabel.github.io/spending-tracker/",
        "description": "A private, offline-ready spending tracker for recording expenses, monitoring debts, reviewing reports, and optionally syncing between devices.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "browserRequirements": "Requires a modern web browser"
      }
    </script>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      html {
        -webkit-text-size-adjust: 100%;
      }
      /* iOS Safari zooms focused controls below 16px, which makes the PWA feel like a web page. */
      input,
      textarea,
      select {
        font-size: 16px !important;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
        overscroll-behavior-y: none;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }

      .search-fallback {
        align-items: center;
        background: #fffdf8;
        color: #1f2328;
        display: flex;
        flex: 1;
        font-family: system-ui, sans-serif;
        justify-content: center;
        padding: 32px;
      }

      .search-fallback__content {
        max-width: 42rem;
      }

      .search-fallback h1 {
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.05;
        margin: 0 0 16px;
      }

      .search-fallback p {
        color: #64707a;
        font-size: 1.1rem;
        line-height: 1.65;
        margin: 0;
      }

      @keyframes spending-countdown-wave-forward {
        from { transform: translate3d(-66px, 0, 0); }
        to { transform: translate3d(0, 0, 0); }
      }

      [data-countdown-wave="forward"] {
        animation: spending-countdown-wave-forward 3.6s linear infinite;
        will-change: transform;
      }
    </style>
  </head>

  <body>
    <noscript>
      Spending Tracker requires JavaScript for secure local storage, offline access, and optional sync.
    </noscript>
    <div id="root">
      <main class="search-fallback">
        <div class="search-fallback__content">
          <h1>Private, offline-ready spending tracker</h1>
          <p>
            Record expenses manually, monitor debts, review spending reports, and optionally sync profiles between
            devices. Spending Tracker keeps working with saved data when your connection drops.
          </p>
        </div>
      </main>
    </div>
  </body>
</html>
